<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>モブたいじ！けいさんバトル百ます</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: "Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
    background: linear-gradient(160deg,#1a2a6c,#2a4d8f 60%,#3a6fc4);
    color:#fff; min-height:100vh; display:flex; flex-direction:column; align-items:center;
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }
  .screen { display:none; width:100%; max-width:560px; padding:12px; flex-direction:column; align-items:center; }
  .screen.active { display:flex; }
  h1 { font-size:26px; text-align:center; line-height:1.3; text-shadow:2px 2px 0 #0006; margin:10px 0 4px; }
  .sub { font-size:14px; color:#ffe98a; text-align:center; margin-bottom:10px; }

  /* ---------- タイトル ---------- */
  .namebox { background:#ffffff22; border-radius:14px; padding:10px 14px; margin:8px 0; width:100%; }
  .namebox input { font-size:20px; width:100%; border:none; border-radius:8px; padding:8px 10px; text-align:center; font-family:inherit; }
  .modebtn {
    width:100%; margin:8px 0; padding:14px; font-size:18px; font-family:inherit; font-weight:bold;
    border:none; border-radius:16px; cursor:pointer; color:#333; box-shadow:0 4px 0 #0005; transition:transform .05s;
  }
  .modebtn:active { transform:translateY(3px); box-shadow:0 1px 0 #0005; }
  .modebtn small { display:block; font-size:12px; font-weight:normal; margin-top:4px; }
  .m-add { background:#ffd35c; } .m-sub { background:#8ade8a; } .m-boss { background:#ff9d7a; } .m-key { background:#9fd0ff; }
  .bestbox { width:100%; background:#ffffff18; border-radius:14px; padding:10px 14px; margin-top:10px; font-size:13px; }
  .bestbox h3 { font-size:14px; color:#ffe98a; margin-bottom:6px; }
  .bestbox table { width:100%; border-collapse:collapse; }
  .bestbox td { padding:2px 4px; border-bottom:1px dashed #ffffff33; }

  /* ---------- プレイ画面 ---------- */
  .hud { width:100%; display:flex; justify-content:space-between; align-items:center; font-size:14px; margin-bottom:6px; }
  .hud .chip { background:#ffffff22; padding:4px 10px; border-radius:999px; white-space:nowrap; }
  .gridwrap { width:100%; overflow:auto; background:#ffffffdd; border-radius:12px; padding:5px; margin-bottom:8px; }
  table.masu { border-collapse:collapse; width:100%; }
  table.masu td, table.masu th {
    border:1px solid #99a; text-align:center; font-size:11px; color:#222;
    width:10%; height:26px; min-width:26px; font-weight:bold;
  }
  table.masu th { background:#cfd8ff; color:#123; }
  table.masu td.done { background:#b9f6b9; }
  table.masu td.miss { background:#ffc9c9; }
  table.masu td.now { background:#fff3a0; box-shadow:inset 0 0 0 2px #e6a400; }

  .battle { width:100%; background:#ffffffee; border-radius:18px; padding:14px; text-align:center; color:#222; position:relative; min-height:210px; }
  .mob { font-size:58px; line-height:1; display:inline-block; }
  .mob.hurt { animation:shake .35s, fadeout .4s .35s forwards; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
  @keyframes fadeout { to { opacity:0; transform:scale(.6) rotate(20deg); } }
  .q { font-size:34px; font-weight:bold; margin:8px 0; letter-spacing:1px; }
  .ansline { font-size:30px; font-weight:bold; margin:4px 0 10px; }
  .ansline .val { display:inline-block; min-width:110px; border-bottom:4px solid #3a6fc4; min-height:38px; }
  .combo { position:absolute; top:8px; right:12px; font-size:15px; color:#e65100; font-weight:bold; }
  .msg { min-height:20px; font-size:14px; color:#c62828; font-weight:bold; }
  .msg.good { color:#2e7d32; }

  .pad { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; width:100%; max-width:340px; margin-top:10px; }
  .pad button {
    font-size:24px; font-family:inherit; font-weight:bold; padding:14px 0; border:none;
    border-radius:14px; background:#fff; color:#222; box-shadow:0 4px 0 #0005; cursor:pointer;
  }
  .pad button:active { transform:translateY(3px); box-shadow:none; }
  .pad .ok { background:#ffd35c; } .pad .del { background:#ffc9c9; }
  .hint { font-size:12px; color:#ffe98a; min-height:16px; margin-top:6px; text-align:center; }

  /* ---------- クリア・表彰状 ---------- */
  .card { width:100%; background:#fffdf3; color:#333; border-radius:18px; padding:22px 16px; text-align:center; margin-top:10px; box-shadow:0 6px 20px #0007; }
  .card h2 { font-size:22px; margin-bottom:8px; }
  .stats { font-size:15px; line-height:1.9; margin:8px 0; }
  .stats b { color:#c62828; }
  .shokaku {
    border:6px double #b8860b; background:linear-gradient(#fffef7,#fff6d8); color:#222;
    border-radius:10px; padding:20px 12px; text-align:center; width:100%;
  }
  .shokaku .title { font-size:30px; letter-spacing:6px; font-weight:bold; color:#8b4513; margin-bottom:10px; }
  .shokaku .name { font-size:22px; margin:10px 0; }
  .shokaku .name u { text-decoration:underline; text-underline-offset:6px; }
  .shokaku .body { font-size:16px; line-height:1.9; margin:10px 0; }
  .shokaku .date { font-size:13px; text-align:right; margin-top:8px; color:#555; }
  .stamp { font-size:40px; margin-top:6px; }
  .btnrow { display:flex; gap:10px; width:100%; max-width:420px; margin-top:12px; }
  .btnrow button {
    flex:1; font-size:16px; font-family:inherit; font-weight:bold; padding:12px; border:none;
    border-radius:14px; cursor:pointer; box-shadow:0 4px 0 #0005;
  }
  .next { background:#8ade8a; color:#222; } .home { background:#fff; color:#222; }
  .confetti { position:fixed; top:-20px; font-size:18px; animation:fall 2.6s linear forwards; z-index:9; }
  @keyframes fall { to { transform:translateY(105vh) rotate(540deg); opacity:.7; } }
  .soundtoggle { position:fixed; top:8px; right:8px; font-size:18px; background:#ffffff33; border:none; border-radius:999px; padding:6px 10px; cursor:pointer; }
</style>
</head>
<body>
<button class="soundtoggle" id="soundToggle">🔊</button>

<!-- ============ タイトル ============ -->
<div class="screen active" id="scr-title">
  <h1>⚔️ モブたいじ！<br>けいさんバトル百ます ⚔️</h1>
  <div class="sub">こたえて モブを たおして しょうがいじょうを めざそう！</div>

  <div class="namebox">
    <label for="playerName" style="font-size:13px;">🌸 なまえ（しょうがいじょうに でるよ）</label>
    <input id="playerName" type="text" maxlength="12" placeholder="なまえを かいてね">
  </div>

  <button class="modebtn m-add" id="btnAdd">➕ たし算100モブ ← ひき算100モブ
    <small>ぜんぶ たおすと「表彰状」が でるよ！</small></button>

  <button class="modebtn m-key" id="btnKey">🧠 かん所バトル（25×・125×など）
    <small>おぼえておくと だいじゅうひん！の けいさん 30連戦</small></button>

  <div class="bestbox" id="bestBox">
    <h3>⭐ じぶんべスト（きのうの じぶんに かてるかな？）</h3>
    <div id="bestBody">まだ きろくが ないよ。ちょうせん してみよう！</div>
  </div>
</div>

<!-- ============ プレイ ============ -->
<div class="screen" id="scr-play">
  <div class="hud">
    <span class="chip" id="hudStage">➕ たし算</span>
    <span class="chip" id="hudProg">もぶ 1/100</span>
    <span class="chip" id="hudTime">⏱ 0:00</span>
  </div>
  <div class="gridwrap" id="gridWrap"></div>
  <div class="battle">
    <div class="combo" id="combo"></div>
    <div class="mob" id="mobIcon">👾</div>
    <div class="q" id="qText">？</div>
    <div class="ansline">= <span class="val" id="ansVal"></span></div>
    <div class="msg" id="msg"></div>
    <div class="hint" id="hint"></div>
  </div>
  <div class="pad">
    <button data-d="1">1</button><button data-d="2">2</button><button data-d="3">3</button>
    <button data-d="4">4</button><button data-d="5">5</button><button data-d="6">6</button>
    <button data-d="7">7</button><button data-d="8">8</button><button data-d="9">9</button>
    <button class="del" id="btnDel">⌫</button><button data-d="0">0</button><button class="ok" id="btnOk">決定</button>
  </div>
</div>

<!-- ============ ステージクリア ============ -->
<div class="screen" id="scr-clear">
  <div class="card">
    <h2 id="clearTitle">🎉 ステージクリア！</h2>
    <div class="stats" id="clearStats"></div>
  </div>
  <div class="btnrow">
    <button class="next" id="btnNextStage">すすむ ▶</button>
    <button class="home" id="btnHome1">🏠 タイトル</button>
  </div>
</div>

<!-- ============ 表彰状 ============ -->
<div class="screen" id="scr-cert">
  <div class="shokaku">
    <div class="title">表　彰　状</div>
    <div class="name"><u id="certName">　　　　</u>　さん</div>
    <div class="body" id="certBody"></div>
    <div id="certHead" style="font-size:24px;font-weight:bold;color:#b8860b;margin:6px 0;">大変よくがんばりました</div>
    <div class="stamp" id="certStamp">🏅</div>
    <div class="date" id="certDate"></div>
  </div>
  <div class="btnrow">
    <button class="next" id="btnAgain">もう1かい！</button>
    <button class="home" id="btnHome2">🏠 タイトル</button>
  </div>
</div>

<script>
/*__CORE_START__*/
// ===== 純粋ロジック（テスト対象）=====
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

// たし算百ます: よこ見出し1-9 × たて見出し1-9
function genAdd(){
  const rows=shuffle([1,2,3,4,5,6,7,8,9]), cols=shuffle([1,2,3,4,5,6,7,8,9]);
  return {rows, cols, ans:(r,c)=>r+c};
}
// ひき算百ます: よこ見出し(ひかれる数)10-18 × たて見出し(ひく数)1-9 → ぜんぶ0以上
function genSub(){
  const rows=Array.from({length:9},()=>randInt(10,18)), cols=shuffle([1,2,3,4,5,6,7,8,9]);
  return {rows, cols, ans:(r,c)=>r-c};
}
// かん所バトル（25×・125×など）問題生成
const KEY_LEVELS = {
  1: [
    {t:n=>n+'×5',  a:n=>n*5,  n:()=>randInt(2,20),  hint:'×5は「半分にして10ばい」！'},
    {t:n=>n+'×25', a:n=>n*25, n:()=>randInt(2,4)*2, hint:'25×4=100 を つかう！'},
    {t:n=>'11×'+n, a:n=>11*n, n:()=>randInt(2,9),   hint:'11×9まで は ぜんぶ そろえよう！'}
  ],
  2: [
    {t:n=>n+'×25', a:n=>n*25, n:()=>randInt(2,6)*2, hint:'25×4=100 を つかう！'},
    {t:n=>n+'×50', a:n=>n*50, n:()=>randInt(2,8),   hint:'50×2=100 を つかう！'},
    {t:n=>'11×'+n, a:n=>11*n, n:()=>randInt(11,19), hint:'十の位と一の位を たして はさむ！'},
    {t:n=>n+'×125',a:n=>n*125,n:()=>randInt(2,4),   hint:'125×8=1000 を つかう！'}
  ],
  3: [
    {t:n=>n+'×25', a:n=>n*25, n:()=>randInt(2,12)*2, hint:'25×4=100 を つかう！'},
    {t:n=>n+'×125',a:n=>n*125,n:()=>randInt(2,8),    hint:'125×8=1000 を つかう！'},
    {t:n=>n+'×99', a:n=>n*99, n:()=>randInt(2,12),   hint:'×100して nを ひく！'},
    {t:n=>n+'×101',a:n=>n*101,n:()=>randInt(2,12),   hint:'×100たして nを たす！'},
    {t:n=>n+'×'+n, a:n=>n*n,  n:()=>randInt(11,19),  hint:'かんぺき に いよう！'}
  ]
};
function genKey(level){ const p=KEY_LEVELS[level]; const m=p[randInt(0,p.length-1)]; const n=m.n(); return {q:m.t(n), ans:m.a(n), hint:m.hint}; }

// 表彰状メッセージ分岐
function certMessage(mistakes, modeName){
  if(mistakes===0){
    return {head:'大変よくできました', stamp:'🏆',
      body:'モブを ぜんぶ たおし、むらに へいわが もどりました！\nきょうの きみは まちがいゼロの ゆうしゃです。'+modeName+'の じゅうます計算を まっさらに きりぬけた きみの そろばんチカラは、むらいちの しょうひんです！'};
  }
  return {head:'大変よくがんばりました', stamp:'🏅',
    body:'きょうも さいごまで あきらめず たたかいました！\nモブを たおすたびに、きみの けいさんチカラは きっと つよくなっています。まけずに もういちど ちょうせん してみよう！'};
}
/*__CORE_END__*/

// ===== 状態 =====
const $=id=>document.getElementById(id);
const MOBS=['👾','👹','👻','🦇','🐺','🐙','🦑','🐊','🦂','🕷️'];
const BOSS='🐲';
let S=null; // 現在のセッション
let soundOn=true;

// ===== サウンド（WebAudio・オフライン）=====
let AC=null;
function beep(freq,dur,type='sine',vol=.15){
  if(!soundOn) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=vol;
    o.connect(g); g.connect(AC.destination); o.start();
    g.gain.exponentialRampToValueAtTime(.001, AC.currentTime+dur);
    o.stop(AC.currentTime+dur);
  }catch(e){}
}
function sndOK(){ beep(660,.09); setTimeout(()=>beep(880,.12),90); }
function sndNG(){ beep(180,.22,'square'); }
function sndClear(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.18),i*140)); }

// ===== 画面切替 =====
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); $(id).classList.add('active'); window.scrollTo(0,0); }

// ===== 記録（じぶんべスト）=====
function loadBest(){ try{ return JSON.parse(localStorage.getItem('mob100_best')||'{}'); }catch(e){ return {}; } }
function saveBest(b){ try{ localStorage.setItem('mob100_best',JSON.stringify(b)); }catch(e){} }
function fmtTime(sec){ const m=Math.floor(sec/60), s=sec%60; return m+':'+String(s).padStart(2,'0'); }
function renderBest(){
  const b=loadBest(), el=$('bestBody');
  const rows=[];
  if(b.add)  rows.push(['➕ たし算百ます','クリア '+fmtTime(b.add.time)+'／まちがい '+b.add.miss]);
  if(b.sub)  rows.push(['➖ ひき算百ます','クリア '+fmtTime(b.sub.time)+'／まちがい '+b.sub.miss]);
  if(b.key1) rows.push(['🧠 かん所レベル1','クリア '+fmtTime(b.key1.time)+'／まちがい '+b.key1.miss]);
  if(b.key2) rows.push(['🧠 かん所レベル2','クリア '+fmtTime(b.key2.time)+'／まちがい '+b.key2.miss]);
  if(b.key3) rows.push(['🧠 かん所レベル3','クリア '+fmtTime(b.key3.time)+'／まちがい '+b.key3.miss]);
  el.innerHTML = rows.length ? rows.map(r=>`<div>⭐ ${r[0]}：<b>${r[1]}</b></div>`).join('')
    : 'まだ きろくが ないよ。ちょうせん してみよう！';
}

// ===== セッション開始 =====
function startSession(mode, level){
  S={ mode, level, stage:0, timeStart:Date.now(), totalMiss:0, combo:0, bestCombo:0,
      grids:[], stages:[] };
  if(mode==='add'){ S.grids=[genAdd(),genSub()]; S.stageNames=['➕ たし算百ます','➖ ひき算百ます']; S.perMode=false; }
  else { S.grids=[null]; S.perMode=true; }
  show('scr-play'); startStage();
}
function keyProblemCount(){ return 30; }

function startStage(){
  const g=S.grids[S.stage];
  S.cells=[]; S.idx=0; S.miss=0; S.missedCells=new Set(); S.retry=[]; S.combo=0;
  if(g){
    for(let r=0;r<9;r++) for(let c=0;c<9;c++) S.cells.push({q:g.rows[r]+'＋'+g.cols[c], a:g.rows[r]+g.cols[c], r, c});
  } else {
    for(let i=0;i<keyProblemCount();i++){
      const lv=Math.min(3,(S.level||1)+(i>=keyProblemCount()-5?1:0)); // こまっら5問はボス(レベル+1)
      const p=genKey(lv); p.boss=(i>=keyProblemCount()-5);
      S.cells.push(p);
    }
  }
  buildGrid(); nextCell(); updateHUD();
  $('hint').textContent = S.perMode ? '' : '';
}

function buildGrid(){
  const wrap=$('gridWrap');
  if(!S.grids[S.stage]){ wrap.innerHTML='<div style="color:#333;font-size:13px;padding:6px;text-align:center;">🧠 かん所バトル：30モブ連戦！ さいごの5ひきはボスだ！</div>'; return; }
  const g=S.grids[S.stage];
  let h='<table class="masu"><tr><th>×</th>'+g.cols.map(c=>`<th>${c}</th>`).join('')+'</tr>';
  for(let r=0;r<9;r++){
    h+=`<tr><th>${g.rows[r]}</th>`;
    for(let c=0;c<9;c++) h+=`<td id="cell-${r}-${c}"></td>`;
    h+='</tr>';
  }
  wrap.innerHTML=h+'</table>';
}

function nextCell(){
  // まちがえたセルを さいちょうせん
  let cell=null;
  if(S.retry.length){ const k=S.retry.shift(); cell=S.cells[k]; S.cur=k; }
  else if(S.idx < S.cells.length){ cell=S.cells[S.idx]; S.cur=S.idx; }
  else { stageClear(); return; }
  S.input=''; $('ansVal').textContent='';
  $('mobIcon').className='mob'; $('mobIcon').style.opacity=1;
  const m = cell.boss ? BOSS : MOBS[(S.cur*7)%MOBS.length];
  $('mobIcon').textContent=m;
  $('qText').textContent=cell.q;
  $('msg').textContent=''; $('msg').className='msg';
  $('hint').textContent = (S.perMode && cell.hint) ? cell.hint : '';
  markNow();
  updateHUD();
}
function markNow(){
  document.querySelectorAll('td.now').forEach(t=>t.classList.remove('now'));
  const g=S.grids[S.stage];
  if(g){ const el=$('cell-'+S.cells[S.cur].r+'-'+S.cells[S.cur].c); if(el) el.classList.add('now'); }
}
function updateHUD(){
  $('hudStage').textContent=S.stageNames?S.stageNames[S.stage]:'🧠 かん所レベル'+(S.level||1);
  $('hudProg').textContent='もぶ '+(Math.min(S.idx+1,S.cells.length))+'/'+S.cells.length;
  const el=Math.floor((Date.now()-S.timeStart)/1000);
  $('hudTime').textContent='⏱ '+fmtTime(el);
}
setInterval(()=>{ if(S && $('scr-play').classList.contains('active')) updateHUD(); },1000);

// ===== 入力 =====
function press(d){
  if(d==='del'){ S.input=S.input.slice(0,-1); }
  else if(d==='ok'){ submit(); return; }
  else if(S.input.length<4){ S.input+=d; }
  $('ansVal').textContent=S.input;
}
function submit(){
  const cell=S.cells[S.cur];
  if(S.input==='') return;
  if(parseInt(S.input,10)===cell.a){
    sndOK(); S.combo++; S.bestCombo=Math.max(S.bestCombo,S.combo);
    $('combo').textContent=S.combo>=3?('🔥'+S.combo+'れんぞく！'):'';
    $('msg').textContent=S.combo>=5?'すごいぞ！モブを たおした！':'モブを たおした！';
    $('msg').className='msg good';
    const ic=$('mobIcon'); ic.className='mob hurt';
    const g=S.grids[S.stage];
    if(g){ const el=$('cell-'+cell.r+'-'+cell.c); if(el){ el.textContent=cell.a; el.className=(S.missedCells.has(S.cur)?'miss':'done'); } }
    if(S.missedCells.has(S.cur)) S.missedCells.delete(S.cur);
    S.idx++;
    setTimeout(nextCell,280);
  } else {
    sndNG(); S.miss++; S.totalMiss++; S.combo=0; $('combo').textContent='';
    S.retry.push(S.cur); S.missedCells.add(S.cur);
    $('msg').textContent='おしい！ もういちど ちゃれんじ！'; $('msg').className='msg';
    if(S.perMode) $('hint').textContent=cell.hint||'';
    S.idx++; // 次へ進み、あとでもう一度
    setTimeout(nextCell,280);
  }
}

// ===== クリア・表彰状 =====
function stageClear(){
  sndClear(); confetti();
  const time=Math.floor((Date.now()-S.timeStart)/1000);
  const b=loadBest();
  const key=(S.mode==='add')?(S.stage===0?'add':'sub'):('key'+(S.level||1));
  let better=false;
  if(!b[key] || time<b[key].time || S.miss<b[key].miss){ b[key]={time,miss:S.miss,date:new Date().toISOString().slice(0,10)}; saveBest(b); better=true; }
  S.stages[S.stage]={time,miss:S.miss};
  if(S.mode==='add' && S.stage===0){
    $('clearTitle').textContent='🎉 たし算 100モブ たいじ！';
    $('clearStats').innerHTML=`まちがい <b>${S.miss}</b>／タイム <b>${fmtTime(time)}</b>${better?'<br>⭐ じぶんべスト こうしん！':''}<br>つぎは ➖ひき算 100モブ だ！`;
    $('btnNextStage').textContent='ひき算へ すすむ ▶';
    $('btnNextStage').onclick=()=>{ S.stage=1; S.timeStart=Date.now(); show('scr-play'); startStage(); };
    show('scr-clear');
  } else {
    showCert(time);
  }
}
function confetti(){
  const em=['🎉','⭐','✨','🎊'];
  for(let i=0;i<24;i++){
    const s=document.createElement('div'); s.className='confetti';
    s.textContent=em[i%em.length];
    s.style.left=(Math.random()*100)+'vw';
    s.style.animationDelay=(Math.random()*.8)+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),3500);
  }
}
function showCert(time){
  const name=($('playerName').value||'ゆうしゃ').trim()||'ゆうしゃ';
  const miss=S.totalMiss;
  const modeName=S.mode==='add'?'たし算・ひき算じゅうます':'かん所バトル';
  const c=certMessage(miss,modeName);
  $('certName').textContent=name;
  $('certBody').innerHTML=c.body.replace(/\n/g,'<br>')+
    `<br><br>ぼうけんの きろく：モブ ${S.mode==='add'?200:keyProblemCount()}体たいじ／まちがい ${miss}回／タイム ${fmtTime(time)}`;
  $('certStamp').textContent=c.stamp;
  $('certHead').textContent=c.head;
  const d=new Date();
  $('certDate').textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日　モブたいじ けいかいじょ';
  show('scr-cert');
  confetti();
}

// ===== イベント =====
$('btnAdd').onclick=()=>startSession('add');
$('btnKey').onclick=()=>{ askLevel(); };
function askLevel(){
  const lv=prompt('レベルを えらんでね：1（やさしい）/ 2（ふつう）/ 3（ムズい）','1');
  const n=parseInt(lv,10);
  if(n===1||n===2||n===3) startSession('key',n);
  else if(lv!==null) askLevel();
}
document.querySelectorAll('.pad [data-d]').forEach(b=>b.onclick=()=>press(b.dataset.d));
$('btnDel').onclick=()=>press('del');
$('btnOk').onclick=()=>press('ok');
document.addEventListener('keydown',e=>{
  if(!$('scr-play').classList.contains('active')) return;
  if(/^[0-9]$/.test(e.key)) press(e.key);
  else if(e.key==='Backspace') press('del');
  else if(e.key==='Enter') press('ok');
});
$('btnHome1').onclick=$('btnHome2').onclick=()=>{ renderBest(); show('scr-title'); };
$('btnAgain').onclick=()=>{ startSession(S.mode,S.level); };
$('soundToggle').onclick=e=>{ soundOn=!soundOn; e.target.textContent=soundOn?'🔊':'🔇'; };
$('playerName').value=(()=>{ try{ return localStorage.getItem('mob100_name')||''; }catch(e){ return ''; } })();
$('playerName').addEventListener('change',e=>{ try{ localStorage.setItem('mob100_name',e.target.value); }catch(err){} });
renderBest();
</script>
</body>
